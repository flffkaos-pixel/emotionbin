plugins { id 'com.android.application' }
android {
    namespace 'com.emotionbin.app'
    compileSdk 36
    defaultConfig {
        applicationId 'com.emotionbin.app'
        minSdk 24
        targetSdk 36
        versionCode 20
        versionName '1.2.4'
    }
    compileOptions {
        // 필수: ads SDK 25가 java.time 사용 — API 26 미만(Android 7) 크래시 방지
        coreLibraryDesugaringEnabled true
    }
    signingConfigs {
        release {
            storeFile file("../android.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "password123"
            keyAlias "android"
            keyPassword System.getenv("KEY_PASSWORD") ?: "password123"
        }
    }
    buildTypes {
        release {
            // ponytail: R8이 Room/SQLite 초기화 클래스를 제거해 WorkManager가 시작 시
            // 크래시(Failed to create WorkDatabase) → WebView 래퍼 앱은 난독화 이득이 없어 끔
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    packaging {
        exclude 'META-INF/*.kotlin_module'
    }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.2'
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
}