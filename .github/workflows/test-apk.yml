name: Test APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/test-apk.yml'

jobs:
  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate launcher icons
        run: |
          for size in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-${size}"
          done
          cp icon-192.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp icon-192.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp icon-512.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp icon-512.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/android.keystore
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          gradle wrapper --gradle-version=9.8.1
          ./gradlew assembleRelease --no-daemon

      # GitHub 러너는 KVM 권한이 없어 에뮬레이터 부팅 실패 → udev 규칙으로 허용
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # API 25 (Android 7.1) = v17 크래시 재현 레벨. java.time 없음 → 디슈가링 검증
      - name: Launch on Android 7 emulator and verify no crash
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 25
          target: google_apis
          arch: x86_64
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: |
            n=0; until adb shell pm list packages >/dev/null 2>&1; do sleep 5; n=$((n+1)); if [ $n -ge 36 ]; then echo "PKG_TIMEOUT"; exit 1; fi; done; echo "PKGS_READY"
            sleep 15; m=0; until adb install -r android/app/build/outputs/apk/release/app-release.apk >/dev/null 2>&1; do sleep 15; m=$((m+1)); if [ $m -ge 5 ]; then echo "INSTALL_FAILED"; adb install -r android/app/build/outputs/apk/release/app-release.apk; exit 1; fi; done; echo "INSTALL_OK"
            adb logcat -c
            # -W는 런치 완료까지 블록되어 구형 에뮬레이터에서 무한 대기 → 논블로킹 실행 + 폴링
            timeout 60 adb shell am start -n com.emotionbin.app/.MainActivity || echo "am start 반환 지연(무시)"
            echo "앱 실행 — 60초 대기 (WebView 로드 + 광고 초기화)"
            sleep 60
            echo "--- 프로세스 상태 ---"
            adb shell pidof com.emotionbin.app || echo "(프로세스 없음)"
            echo "--- 크래시/ANR 로그 ---"
            adb logcat -d | grep -E "AndroidRuntime|FATAL|ANR in com.emotionbin.app" | head -50 || echo "(크래시 로그 없음)"
            FAIL=0
            if ! adb shell pidof com.emotionbin.app | grep -q .; then echo "APP_CRASHED"; FAIL=1; fi
            if adb logcat -d | grep -q "FATAL EXCEPTION"; then echo "FATAL_EXCEPTION_FOUND"; adb logcat -d | grep -A 25 "FATAL EXCEPTION" | head -80; FAIL=1; fi
            if [ "$FAIL" -eq 0 ]; then echo "APP_ALIVE_NO_CRASH_TESTS_PASSED"; fi
            exit $FAIL
