name: Test APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/test-apk.yml'

jobs:
  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate launcher icons
        run: |
          for size in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-${size}"
          done
          cp icon-192.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp icon-192.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp icon-512.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp icon-512.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/android.keystore
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          gradle wrapper --gradle-version=9.8.1
          ./gradlew assembleRelease --no-daemon

      # API 30 — 러너에 사전설치된 빠른 이미지 (KVM 부팅 ~2분). 크래시-오프닝 회귀 검증
      - name: Launch on Android emulator and verify no crash
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: |
            # 부팅 플래그 후에도 package 서비스가 늦게 뜨는 경우 대기 (최대 3분)
            echo "Waiting for package service..."
            n=0
            until adb shell pm list packages >/dev/null 2>&1; do
              sleep 5
              n=$((n+1))
              if [ $n -ge 36 ]; then echo "package service timeout"; exit 1; fi
            done
            echo "Package service ready"

            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell am start -W -n com.emotionbin.app/.MainActivity
            echo "App started. Waiting 25s (WebView load + ads init)..."
            sleep 25

            if adb shell pidof com.emotionbin.app >/dev/null 2>&1; then
              echo "✓ APP ALIVE — 크래시 없음"
            else
              echo "✗ APP CRASHED"
              adb logcat -d | grep -E -A 20 "FATAL EXCEPTION" | head -60
              exit 1
            fi

            CRASH_COUNT=$(adb logcat -d | grep -c "FATAL EXCEPTION" || true)
            if [ "$CRASH_COUNT" -gt 0 ]; then
              echo "✗ FATAL EXCEPTION 발견"
              adb logcat -d | grep -A 20 "FATAL EXCEPTION" | head -60
              exit 1
            fi
            echo "✓ NO CRASH — 테스트 통과"