name: Test APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/test-apk.yml'

jobs:
  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate launcher icons
        run: |
          for size in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-${size}"
          done
          cp icon-192.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp icon-192.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp icon-512.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp icon-512.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/android.keystore
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          gradle wrapper --gradle-version=9.8.1
          ./gradlew assembleRelease --no-daemon

      # API 30 — 러너에 사전설치된 빠른 이미지 (KVM 부팅 ~2분). 크래시-오프닝 회귀 검증
      - name: Launch on Android emulator and verify no crash
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: |
            n=0; until adb shell pm list packages >/dev/null 2>&1; do sleep 5; n=$((n+1)); if [ $n -ge 36 ]; then echo "PKG_TIMEOUT"; exit 1; fi; done; echo "PKGS_READY"
            sleep 20; m=0; until adb install -r android/app/build/outputs/apk/release/app-release.apk >/dev/null 2>&1; do sleep 15; m=$((m+1)); if [ $m -ge 5 ]; then echo "INSTALL_FAILED"; adb install -r android/app/build/outputs/apk/release/app-release.apk; exit 1; fi; done; echo "INSTALL_OK"
            adb logcat -c
            adb shell am start -W -n com.emotionbin.app/.MainActivity
            sleep 25
            adb shell pidof com.emotionbin.app | grep -q . && echo "APP_ALIVE" || exit 1
            adb logcat -d | grep "FATAL EXCEPTION" | head -20; adb logcat -d | grep -q "FATAL EXCEPTION" && exit 1 || echo "NO_FATAL_CRASH_OK"
            echo "ALL_TESTS_PASSED"